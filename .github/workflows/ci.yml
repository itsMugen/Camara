name: CI

on:
  push:
    branches: [main]
    paths: ["url-shortener/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["url-shortener/**", ".github/workflows/ci.yml"]

# On the self-hosted runner on the Mac only, never GitHub's cloud. The checks
# are url-shortener/scripts/ci.sh, which anyone can run locally too: lint, the
# tests on Python 3.11 to 3.13 against a throwaway MongoDB each, and the
# install.sh round trip. A runner on macOS cannot use service containers, so
# the script starts MongoDB itself. The runner needs Docker Desktop running and
# uv on its PATH (uv fetches the Pythons).
defaults:
  run:
    working-directory: url-shortener

jobs:
  ci:
    name: lint · tests (3.11, 3.12, 3.13) · install
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: scripts/ci.sh
        run: scripts/ci.sh
