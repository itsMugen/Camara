[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener"
version = "0.1.0"
description = "A command line URL shortener backed by MongoDB, with expiring links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mongomock>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
url-shortener = "url_shortener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # mongomock (a test dependency) still calls datetime.utcnow() on Python 3.12+.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock",
]
markers = [
    "integration: needs a real MongoDB at SHORTENER_TEST_MONGO_URI (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mongomock.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["url_shortener"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
